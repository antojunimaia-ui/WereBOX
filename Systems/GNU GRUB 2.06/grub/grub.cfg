# grub.cfg — menu real do GNU GRUB 2.06 usado pelo reDOS.
# Este arquivo e' embutido no core.img (memdisk) por grub-mkstandalone.
# Para mudar o menu, edite aqui e regenere o core.img (veja README.md).

set timeout=12
set default=0

# O MS-DOS e o Windows 3.11 dividem o mesmo C: (c.img). Para o GRUB escolher
# qual dos dois AUTOEXEC.BAT roda, ele grava uma flag no CMOS (registro 0x0E):
#   0x00 = MS-DOS normal
#   0x5A = C:\BOOTWIN.COM roda C:\WINDOWS\WIN /3
# O C:\BOOTWIN.COM limpa a flag depois de ler, entao ela vale so' para o boot.

menuentry "MS-DOS 6.22 (C:)" {
  insmod chain
  insmod drivemap
  insmod iorw

  outb 0x70 0x0E
  outb 0x71 0x00

  # O GRUB ocupa o disco 0 (hda) e o MS-DOS esta no disco 1 (hdb). O drivemap
  # troca os dois no BIOS para o DOS enxergar o seu disco como C: (0x80).
  set root=(hd1)
  drivemap -s (hd0) (hd1)
  chainloader (hd1)+1
}

menuentry "Windows 3.11 (C:)" {
  insmod chain
  insmod drivemap
  insmod iorw

  outb 0x70 0x0E
  outb 0x71 0x5A

  set root=(hd1)
  drivemap -s (hd0) (hd1)
  chainloader (hd1)+1
}

menuentry "Windows 1.01 (A:)" {
  insmod chain

  # O chainloader usa o root device para escolher o DL passado ao boot sector;
  # sem set root=(fd0) ele passaria o disco rígido e o DOS 3.3 falharia com
  # "Disk Boot failure".
  set root=(fd0)
  chainloader (fd0)+1
}

menuentry "KolibriOS (B:)" {
  insmod chain
  insmod drivemap

  set root=(fd1)
  drivemap -s (fd0) (fd1)
  chainloader (fd1)+1
}

